
<!DOCTYPE html>
<html>
<head>
    <title>Date and Dropdown List</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        h2 {
            color: darkblue;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 16px;
        }

        select,
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        select {
            background-color: lightyellow;
        }

        input[type="date"] {
            background-color: lightcyan;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <label>Select Country:</label>

        <select>
            <option value="">Choose Country</option>
            <option>Pakistan</option>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
        </select>

        <label>Select Date:</label>

        <input type="date">

    </div>

</body>
</html>
